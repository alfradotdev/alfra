<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".5" stop-color="#bd34fe"/><stop offset="1" stop-color="#41d1ff"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5c67f2" stop-opacity=".5"/><stop offset="1" stop-color="#5c67f2" stop-opacity="0"/></radialGradient>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1e34"/><stop offset="1" stop-color="#141424"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
  <style>
    .ring{animation:dash 14s linear infinite}
    .spin{transform-origin:300px 300px;animation:spin 18s linear infinite}
    .node{animation:float 5s ease-in-out infinite}
    .ln{opacity:0;animation:type 7s ease-out infinite}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes dash{to{stroke-dashoffset:-280}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes type{0%{opacity:0;transform:translateX(-6px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
</defs>
