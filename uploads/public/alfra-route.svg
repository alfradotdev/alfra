<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="loop" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".5" stop-color="#bd34fe"/><stop offset="1" stop-color="#41d1ff"/></linearGradient>
  <radialGradient id="g" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#5c67f2" stop-opacity=".25"/><stop offset="1" stop-color="#5c67f2" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity=".08"/></pattern>
  <style>.trail{animation:d 4s linear infinite}@keyframes d{to{stroke-dashoffset:-60}}.p{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-out infinite}@keyframes p{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
</defs>
<rect width="1200" height="900" rx="32" fill="#0d0d17"/>
<rect width="1200" height="900" rx="32" fill="url(#dots)"/>
<rect width="1200" height="900" rx="32" fill="url(#g)"/>
<path d="M260 600 C 420 260, 780 200, 940 300" stroke="#2c2c48" stroke-width="10" stroke-linecap="round"/>
<path class="trail" d="M260 600 C 420 260, 780 200, 940 300" stroke="url(#loop)" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 16"/>
<circle r="8" fill="#fff"><animateMotion dur="5s" repeatCount="indefinite" path="M260 600 C 420 260, 780 200, 940 300"/></circle>
<circle class="p" cx="260" cy="600" r="16" fill="#ff6b6b"/><circle cx="260" cy="600" r="11" fill="#ff6b6b"/>
<circle class="p" cx="940" cy="300" r="16" fill="#41d1ff" style="animation-delay:1.2s"/><circle cx="940" cy="300" r="11" fill="#41d1ff"/>
<g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Inter,sans-serif">
  <text x="200" y="660" font-size="30" font-weight="700" fill="#e8e8f4">Honduras</text>
  <text x="200" y="694" font-size="19" fill="#8a8aa6">UNITEC · Computer Engineering</text>
  <text x="840" y="250" font-size="30" font-weight="700" fill="#e8e8f4">Boston, MA</text>
  <text x="840" y="215" font-size="19" fill="#8a8aa6">Full-stack developer</text>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#8a8aa6">
  <text x="430" y="330">PHP · Yii2</text>
  <text x="590" y="262">Frappe · ERPNext</text>
